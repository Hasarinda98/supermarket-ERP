<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supermarket ERP</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>Supermarket ERP System</h1><p>Product and Supplier Management</p></header>
<nav><button class="tab active" data-page="products">Products</button><button class="tab" data-page="suppliers">Suppliers</button></nav>
<main><div id="message"></div>
<section id="products" class="page active"><h2>Product Management</h2><div class="scan"><label>Scan barcode <input id="scan-input" placeholder="Scan and press Enter"></label><span id="scan-status"></span></div><div class="grid"><form id="product-form" class="card"><h3 id="product-title">Add Product</h3><input type="hidden" id="product-id"><label>Barcode<input id="barcode" required></label><label>Name<input id="product-name" required></label><label>Description<textarea id="description"></textarea></label><label>Price<input id="price" type="number" min="0" step="0.01" required></label><label>Quantity<input id="quantity" type="number" min="0" required></label><label>Supplier<select id="product-supplier"><option value="">No supplier</option></select></label><div><button class="primary">Save Product</button><button type="button" id="product-cancel" hidden>Cancel</button></div></form><div class="card"><h3>Product List</h3><input id="product-search" placeholder="Search products"><div class="table"><table><thead><tr><th>Barcode</th><th>Name</th><th>Price</th><th>Qty</th><th>Supplier</th><th>Actions</th></tr></thead><tbody id="product-body"></tbody></table></div></div></div></section>
<section id="suppliers" class="page"><h2>Supplier Management</h2><div class="grid"><form id="supplier-form" class="card"><h3 id="supplier-title">Add Supplier</h3><input type="hidden" id="supplier-id"><label>Supplier Name<input id="supplier-name" required maxlength="100"></label><label>Company<input id="company" required maxlength="120"></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>Address<textarea id="address" required maxlength="255"></textarea></label><div><button class="primary">Save Supplier</button><button type="button" id="supplier-cancel" hidden>Cancel</button></div></form><div class="card"><h3>Supplier List</h3><input id="supplier-search" placeholder="Search suppliers"><div class="table"><table><thead><tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead><tbody id="supplier-body"></tbody></table></div></div></div></section>
</main><footer>Enterprise Application Development - Assignment 02</footer><script src="app.js"></script></body></html>
