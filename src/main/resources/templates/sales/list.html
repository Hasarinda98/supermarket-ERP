<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sales - Supermarket ERP</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        .navbar {
            background: #2c3e50;
            color: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 18px;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #777;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
        }

        .add {
            background: #27ae60;
            color: white;
        }

        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #34495e;
            color: white;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
        }

        td {
            border-bottom: 1px solid #eee;
        }

        .status {
            color: #27ae60;
            font-weight: bold;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #888;
        }

    </style>

</head>

<body>

<div class="navbar">

    <h2>Supermarket ERP</h2>

    <div>
        <a th:href="@{/}">Home</a>
        <a th:href="@{/purchase-orders}">Purchase Orders</a>
        <a th:href="@{/grn}">GRN</a>
        <a th:href="@{/inventory}">Inventory</a>
        <a th:href="@{/sales}">Sales</a>
    </div>

</div>

<div class="container">

    <div class="page-header">

        <div>

            <h1>Sales Receipts</h1>

            <p class="subtitle">
                Manage supermarket sales transactions.
            </p>

        </div>

        <a th:href="@{/sales/new}"
           class="btn add">
            + New Sale
        </a>

    </div>

    <div class="card">

        <table>

            <thead>

            <tr>
                <th>Receipt No</th>
                <th>Date</th>
                <th>Cashier</th>
                <th>Product</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Payment</th>
                <th>Status</th>
            </tr>

            </thead>

            <tbody>

            <tr th:each="sale : ${salesReceipts}">

                <td th:text="${sale.receiptNumber}">
                    SR001
                </td>

                <td th:text="${sale.receiptDate}">
                    Date
                </td>

                <td th:text="${sale.cashier.fullName}">
                    Cashier
                </td>

                <td th:text="${!#lists.isEmpty(sale.items)
                        ? sale.items[0].product.name
                        : '-'}">
                    Product
                </td>

                <td th:text="${!#lists.isEmpty(sale.items)
                        ? sale.items[0].quantity
                        : 0}">
                    0
                </td>

                <td th:text="${sale.totalAmount}">
                    0.00
                </td>

                <td th:text="${sale.paymentMethod}">
                    CASH
                </td>

                <td>
                    <span class="status"
                          th:text="${sale.status}">
                        COMPLETED
                    </span>
                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(salesReceipts)}">

                <td colspan="8"
                    class="empty">

                    No sales receipts found.
                    Click "New Sale" to create the first sale.

                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
