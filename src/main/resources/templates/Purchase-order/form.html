<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Purchase Order</title>
</head>

<body>

<h2>Purchase Order</h2>

<form
        th:action="@{/purchase-orders/save}"
        th:object="${purchaseOrder}"
        method="post">

    <input
            type="hidden"
            th:field="*{id}">

    <label>PO Number</label>

    <input
            type="text"
            th:field="*{poNumber}"
            required>

    <br><br>

    <label>Order Date</label>

    <input
            type="date"
            th:field="*{orderDate}"
            required>

    <br><br>

    <label>Supplier</label>

    <input
            type="text"
            th:field="*{supplierName}"
            required>

    <br><br>

    <label>Product</label>

    <input
            type="text"
            th:field="*{productName}"
            required>

    <br><br>

    <label>Quantity</label>

    <input
            type="number"
            th:field="*{quantity}"
            required>

    <br><br>

    <label>Unit Price</label>

    <input
            type="number"
            step="0.01"
            th:field="*{unitPrice}"
            required>

    <br><br>

    <label>Status</label>

    <select th:field="*{status}">

        <option value="PENDING">
            Pending
        </option>

        <option value="APPROVED">
            Approved
        </option>

        <option value="RECEIVED">
            Received
        </option>

    </select>

    <br><br>

    <button type="submit">
        Save Purchase Order
    </button>

</form>

</body>
</html>
